<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港鳥類圖鑑</title>
    <style>
        /* --- CSS Styling (樣式) --- */
        :root {
            --primary-bg: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            --error-bg: #ff4757;
            --log-bg: #1e272e;
            --log-text: #0be881;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', 'Microsoft JhengHei', '微軟正黑體', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 20px; background: var(--primary-bg); min-height: 100vh; color: #333; }
        h1 { text-align: center; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); margin-bottom: 5px; }
        .subtitle { text-align: center; color: rgba(255, 255, 255, 0.9); margin-bottom: 30px; font-size: 1.1rem; }
        #error-message { display: none; background-color: #ffa502; color: #1e272e; text-align: center; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .container { display: flex; flex-wrap: wrap; gap: 30px; max-width: 1200px; margin: 0 auto; }
        .column { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 20px; }
        .upload-section { background: rgba(255, 255, 255, 0.9); padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .upload-btn { background-color: #3742fa; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.3s; }
        .upload-btn:hover { background-color: #5352ed; }
        input[type="file"] { display: none; }
        .pokemon-card-wrapper { position: relative; perspective: 1000px; min-height: 550px; }
        .pokemon-card { background: rgba(255, 255, 255, 0.25); border-radius: 20px; padding: 15px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.4); position: relative; overflow: hidden; min-height: 550px; display: flex; flex-direction: column; transition: transform 0.3s, box-shadow 0.3s; }
        .pokemon-card:hover { box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.5); }
        .pokemon-card::after { content: ''; position: absolute; top: -50%; left: -50%; right: -50%; bottom: -50%; background: linear-gradient(135deg, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, 0.45) 45%, rgba(255, 240, 150, 0.3) 50%, rgba(150, 255, 255, 0.3) 55%, rgba(255, 255, 255, 0) 70%); transform: rotate(25deg); pointer-events: none; animation: holoShine 7s infinite linear; z-index: 5; }
        @keyframes holoShine { 0% { transform: translateX(-100%) rotate(25deg); } 100% { transform: translateX(100%) rotate(25deg); } }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(0,0,0,0.1); padding-bottom: 8px; margin-bottom: 12px; z-index: 10; }
        .card-name-wrapper { display: flex; flex-direction: column; }
        .card-name { font-size: 1.6rem; font-weight: bold; color: #1e272e; }
        .card-subname { font-size: 0.9rem; color: #57606f; font-weight: 600; }
        .card-hp { font-size: 1.3rem; font-weight: bold; color: #c23616; }
        .card-image-container { background: rgba(0,0,0,0.08); height: 290px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; border: 3px solid rgba(255,255,255,0.6); overflow: hidden; position: relative; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .official-card-art { width: 100%; height: 100%; object-fit: contain; display: none; }
        .view-toggle-btn { position: absolute; bottom: 8px; right: 8px; background: rgba(0, 0, 0, 0.7); color: white; border: none; padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; z-index: 20; transition: background 0.2s; display: none; }
        .view-toggle-btn:hover { background: rgba(0, 0, 0, 0.9); }
        .card-stats { background: rgba(255,255,255,0.65); padding: 12px; border-radius: 12px; flex-grow: 1; z-index: 10; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 1rem; }
        .card-intro { margin-top: 12px; font-style: italic; font-size: 0.85rem; color: #2f3640; text-align: center; z-index: 10; line-height: 1.3; }
        .empty-placeholder { text-align: center; margin: auto; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; z-index: 10; }
        .placeholder-card-back { max-width: 250px; height: auto; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); border: 2px solid rgba(255, 255, 255, 0.5); transition: transform 0.3s ease; }
        .pokemon-card:hover .placeholder-card-back { transform: scale(1.03) rotate(-1deg); }
        .placeholder-text { font-size: 1.1rem; font-weight: bold; color: #2f3542; text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.6); }
        #active-card-content { display: none; height: 100%; flex-direction: column; }
        .loader { display: none; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid #3742fa; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; position: absolute; z-index: 15; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .scanning-log { background-color: var(--log-bg); color: var(--log-text); padding: 20px; border-radius: 12px; font-family: 'Courier New', Courier, monospace; height: 100%; min-height: 450px; overflow-y: auto; box-shadow: inset 0 0 15px rgba(0,0,0,0.5); border: 2px solid #2f3640; }
        .log-entry { margin-bottom: 10px; line-height: 1.4; font-size: 0.95rem; }
        .log-entry.error { color: #ff4757; }
        .log-entry.success { color: #1e90ff; }
        .log-entry.warning { color: #ffa502; }
    </style>
</head>
<body>

    <h1>🐦 香港鳥類圖鑑</h1>
    <div class="subtitle">人工智能鳥類鑑別器與全息卡牌生成器</div>

    <div id="error-message"></div>

    <div class="container">
        <!-- LEFT COLUMN (Scanner & Card Display) -->
        <div class="column">
            <div class="upload-section">
                <h3>掃描鳥類圖像</h3>
                <p>上傳真實的鳥類照片進行分析！</p>
                <button class="upload-btn" onclick="document.getElementById('imageInput').click()">
                    📸 選擇圖像
                </button>
                <input type="file" id="imageInput" accept="image/*">
            </div>

            <div class="pokemon-card-wrapper">
                <div class="pokemon-card">
                    <!-- Premium Mystery Card Back Placeholder -->
                    <div class="empty-placeholder" id="card-placeholder">
                        <img class="placeholder-card-back" src="s-l1600.webp" alt="神秘卡背">
                        <div class="placeholder-text">等待圖鑑掃描...</div>
                    </div>

                    <div id="active-card-content">
                        <div class="card-header">
                            <div class="card-name-wrapper">
                                <div class="card-name" id="ui-name">名稱</div>
                                <div class="card-subname" id="ui-subname">英文名稱</div>
                            </div>
                            <div class="card-hp" id="ui-hp">HP</div>
                        </div>
                        <div class="card-image-container">
                            <div class="loader" id="image-loader"></div>
                            <img id="ui-image" src="" alt="掃描的鳥" style="width:100%; height:100%; object-fit:cover;">
                            <img id="ui-official-art" class="official-card-art" src="" alt="全息卡牌插圖">
                            
                            <button id="view-toggle" class="view-toggle-btn" onclick="toggleArtView()">
                                🔄 切換視圖
                            </button>
                        </div>
                       
                        <div class="card-intro" id="ui-intro">介紹文字...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN (Terminal Log Output) -->
        <div class="column">
            <div class="scanning-log" id="log-container">
                <div class="log-entry">> 生物圖鑑數據庫已上線...</div>
                <div class="log-entry">> 正在監聽中文及英文分類...</div>
                <div class="log-entry">> 準備接收傳輸。</div>
            </div>
        </div>
    </div>

    <!-- --- JavaScript Logic (處理邏輯) --- -->
    <script>
        // --- 1. LOCAL DATABASE (Bilingual English / Traditional Chinese matches) ---
        const birdDatabase = [
            // ... (The database remains the same)
             {
                name: "Black-faced spoonbill",
                chineseName: "黑臉琵鷺",
                hp: "120 HP",
                type: "Water / Flying (水 / 飛行)",
                attack1: "觸覺掃食 (Touch Sweep)",
                attack2: "米埔越冬 (Winter Migrant Storm)",
                intro: "An endangered species known for its distinct spoon-shaped beak. Often found in Deep Bay wetlands. 每年冬季從北方遷徙，準時造訪香港米埔濕地。",
                cardImage: "CardBlack.png"
            },
            {
                name: "Spotted Dove",
                chineseName: "珠頸斑鳩",
                hp: "100 HP",
                type: "Normal / Flying (一般 / 飛行)",
                attack1: "斑鳩咕咕 (Coo Attack)",
                attack2: "都市珠頸 (Urban Forage 60)",
                intro: "Named for the prominent spotted patch on its neck. Extremely common urban resident in Hong Kong gardens. 頸部兩側有顯著的白色斑點，適應都市生活。",
                cardImage: "Gemini_Generated_Image_p30l0yp30l0yp30l.png"
            },
            {
                name: "Eurasian Tree Sparrow",
                chineseName: "樹麻雀",
                hp: "60 HP",
                type: "Normal / Flying (一般 / 飛行)",
                attack1: "成群結隊 (Flock Call 20)",
                attack2: "都市覓食 (Urban Forage 50)",
                intro: "The most common urban bird in Hong Kong. Small, brown, highly adaptable, nesting on pipes and buildings. 喜歡群體活動，適應力極強。",
                cardImage: "Gemini_Generated_Image_6jtnne6jtnne6jtn.png"
            },
            {
                name: "Red-whiskered bulbul",
                chineseName: "紅耳鵯",
                hp: "80 HP",
                type: "Normal / Flying (一般 / 飛行)",
                attack1: "高唱囉囉高 (Loud Crest Sing)",
                attack2: "公園高帽 (Park Glade 60)",
                intro: "Recognizable by its tall black crest and bright red cheek patches. Extremely vocal and commonly found in HK city parks. 頭頂黑色高聳羽冠，眼睛下方有顯著紅斑。",
                cardImage: "Gemini_Generated_Image_p4q3g0p4q3g0p4q3.png"
            },
            {
                name: "Peregrine Falcon",
                chineseName: "遊隼",
                hp: "150 HP",
                type: "Steel / Flying (鋼 / 飛行)",
                attack1: "時速突襲 (Speed Dive 120)",
                attack2: "獵鷹利爪 (Razor Talons 100)",
                intro: "A majestic and powerful bird of prey in Hong Kong. One of the fastest creatures on Earth, diving at speeds over 300 km/h! 在空中全速俯衝時速度驚人，極致的空中掠食者。",
                cardImage: "Gemini_Generated_Image_bef3irbef3irbef3.png"
            },
            {
                name: "Chestnut bulbul",
                chineseName: "栗背短腳鵯",
                hp: "70 HP",
                type: "Normal / Flying (一般 / 飛行)",
                attack1: "Peck / 啄擊 (20)",
                attack2: "Chestnut Flurry / 栗色亂舞 (50)",
                intro: "A small bird with warm chestnut plumage, commonly heard singing high in Hong Kong's native forests."
            },
            {
                name: "Mountain Tailorbird",
                chineseName: "栗頭縫葉鶯",
                hp: "50 HP",
                type: "Grass / Flying (草 / 飛行)",
                attack1: "Leaf Stitch / 縫葉術 (10)",
                attack2: "Needle Beak / 針嘴突刺 (40)",
                intro: "Famous for 'sewing' large leaves together using spiderwebs to build its nest. Tiny, energetic, and active."
            },
            {
                name: "Greater Necklaced Laughingthrush",
                chineseName: "黑領噪鶥",
                hp: "90 HP",
                type: "Dark / Flying (惡 / 飛行)",
                attack1: "Chorus Call / 合唱召喚 (40)",
                attack2: "Necklace Glare / 頸環瞪視 (70)",
                intro: "A loud social bird with a distinctive black 'necklace' marking. Often travels in noisy forest floor flocks."
            },
            {
                name: "Swinhoe's White-eye",
                chineseName: "暗綠繡眼鳥",
                hp: "50 HP",
                type: "Grass / Flying (草 / 飛行)",
                attack1: "Nectar Sip / 花蜜吸食 (Heal 20)",
                attack2: "Acrobatics / 特技俯衝 (40)",
                intro: "A tiny, yellow-green bird with a distinct white ring around its eye. Loves flowering trees and sweet nectar."
            },
            {
                name: "Black Kite",
                chineseName: "麻鷹",
                hp: "140 HP",
                type: "Dark / Flying (惡 / 飛行)",
                attack1: "Thermal Glide / 熱氣流滑翔",
                attack2: "Talon Dive / 飛爪奇襲 (100)",
                intro: "Hong Kong's most famous bird of prey. Easily spotted soaring in beautiful circles above Victoria Harbour."
            },
            {
                name: "Asian Koel",
                chineseName: "噪鵑",
                hp: "80 HP",
                type: "Dark / Flying (惡 / 飛行)",
                attack1: "Deafening Call / 刺耳啼鳴 (Confusion)",
                attack2: "Shadow Stealth / 陰影潛伏 (50)",
                intro: "Famous for its incredibly loud 'ko-el' mating call that echoes throughout Hong Kong neighborhoods in spring."
            }
        ];

        const validBirdNames = birdDatabase.map(b => `${b.name} (${b.chineseName})`).join(", ");
        const apiKey = "AQ.Ab8RN6KrjVeS3ugqcn39JXLcJ2P-BSaGDEIWRqnQCNu5h6FRhw"; 
        const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        const logContainer = document.getElementById('log-container');
        const errorMessage = document.getElementById('error-message');
        const loader = document.getElementById('image-loader');
        const uiImage = document.getElementById('ui-image');
        const uiOfficialArt = document.getElementById('ui-official-art');
        const viewToggleBtn = document.getElementById('view-toggle');
        let currentActiveArtUrl = ""; 
        let showingOfficialArt = false; 

        function addLog(text, type = 'normal') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] > ${text}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function showCustomWarning(msg) {
            errorMessage.textContent = msg;
            errorMessage.style.display = 'block';
            setTimeout(() => { errorMessage.style.display = 'none'; }, 6000);
        }

        async function fetchWithBackoff(url, options, retries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
                    return await response.json();
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        }

        function toggleArtView() {
            if (!currentActiveArtUrl) return;
            showingOfficialArt = !showingOfficialArt;
            if (showingOfficialArt) {
                uiImage.style.display = 'none';
                uiOfficialArt.style.display = 'block';
                addLog("Switched visual to Official Holographic Card Art.");
            } else {
                uiImage.style.display = 'block';
                uiOfficialArt.style.display = 'none';
                addLog("Switched visual to Scanned Upload Photo.");
            }
        }

        document.getElementById('imageInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            addLog(`Selected file: "${file.name}". Initializing scan sequence...`, "normal");
            document.getElementById('card-placeholder').style.display = 'none';
            document.getElementById('active-card-content').style.display = 'flex';
            uiImage.style.display = 'none';
            uiOfficialArt.style.display = 'none';
            viewToggleBtn.style.display = 'none';
            loader.style.display = 'block';

            document.getElementById('ui-name').textContent = "分析中...";
            document.getElementById('ui-subname').textContent = "正在分析物種分類...";
            document.getElementById('ui-hp').textContent = "---";
            document.getElementById('ui-type').textContent = "---";
            document.getElementById('ui-atk1').textContent = "---";
            document.getElementById('ui-atk2').textContent = "---";
            document.getElementById('ui-intro').textContent = "正在掃描羽毛、鳥冠和生物特徵...";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const base64Image = e.target.result;
                uiImage.src = base64Image;
                uiImage.style.display = 'block';
                loader.style.display = 'none';
                addLog("Image prepared. Submitting structural data to Vision Model...", "normal");
                callGeminiAPI(base64Image);
            };
            reader.onerror = function() {
                loader.style.display = 'none';
                showCustomWarning("無法處理所選的圖像文件。");
                addLog("ERROR: Reading file failed.", "error");
                resetCardUI();
            }
        });

        async function callGeminiAPI(base64FullString) {
            const mimeType = base64FullString.match(/data:(.*?);/)[1];
            const base64Data = base64FullString.split(',')[1];
            const prompt = `Identify the bird in this image. It must be matched against this database list: [${validBirdNames}]. You must match the bird. Return ONLY the exact English name of the bird (e.g. "Spotted Dove") or the exact Chinese name (e.g. "紅耳鵯"). Do not output any other details, periods, prefix or explanation.`;
            const payload = { contents: [{ role: "user", parts: [{ text: prompt }, { inlineData: { mimeType: mimeType, data: base64Data } }] }] };

            try {
                const data = await fetchWithBackoff(GEMINI_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const aiResponseString = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
                addLog(`Vision data returned: "${aiResponseString}"`, "success");
                matchEngine(aiResponseString);
            } catch (error) {
                console.error("API Error:", error);
                addLog(`NETWORK DETECTED ISSUES: Initializing card synthesis sequence...`, "warning");
                forceRandomGeneration("Synthesizing deck");
            }
        }

        function matchEngine(identifiedName) {
            addLog("Cross-referencing database taxonomy...", "normal");
            const normalize = (str) => str.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]/g, "");
            const cleanResponse = normalize(identifiedName);
            const match = birdDatabase.find(bird => normalize(bird.name) === cleanResponse || normalize(bird.chineseName) === cleanResponse);

            if (match) {
                addLog(`Match Confirmed! Found Database Entry: ${match.chineseName} (${match.name})`, "success");
                updatePokemonCard(match);
            } else {
                addLog(`Could not find a direct database classification for "${identifiedName}".`, "warning");
                forceRandomGeneration(identifiedName);
            }
        }

        function forceRandomGeneration(sourceLabel) {
            showCustomWarning("我們將此識別為一個罕見的神秘變體！正在生成隨機的全息卡牌圖案。");
            const randomIndex = Math.floor(Math.random() * birdDatabase.length);
            const randomBird = birdDatabase[randomIndex];
            addLog(`RANDOM SCAN COMPLETED (Source identifier: "${sourceLabel}")`, "warning");
            addLog(`Holographic structural layout generated: ${randomBird.chineseName} / ${randomBird.name}!`, "success");
            updatePokemonCard(randomBird);
        }

        function updatePokemonCard(birdData) {
            document.getElementById('ui-name').textContent = birdData.chineseName || birdData.name;
            document.getElementById('ui-subname').textContent = birdData.chineseName ? birdData.name : "";
            document.getElementById('ui-hp').textContent = birdData.hp;
            document.getElementById('ui-type').textContent = birdData.type;
            document.getElementById('ui-atk1').textContent = birdData.attack1;
            document.getElementById('ui-atk2').textContent = birdData.attack2;
            document.getElementById('ui-intro').textContent = birdData.intro;

            if (birdData.cardImage) {
                currentActiveArtUrl = birdData.cardImage;
                uiOfficialArt.src = birdData.cardImage;
                uiImage.style.display = 'none';
                uiOfficialArt.style.display = 'block';
                showingOfficialArt = true;
                viewToggleBtn.style.display = 'block';
                addLog(`Hologram loaded! Use the "Switch View" button inside the card image to swap to your original upload.`);
            } else {
                currentActiveArtUrl = "";
                uiOfficialArt.src = "";
                uiImage.style.display = 'block';
                uiOfficialArt.style.display = 'none';
                showingOfficialArt = false;
                viewToggleBtn.style.display = 'none';
            }
            const card = document.querySelector('.pokemon-card');
            card.style.transform = 'scale(1.05)';
            setTimeout(() => { card.style.transform = 'scale(1)'; }, 300);
        }

        function resetCardUI() {
            document.getElementById('card-placeholder').style.display = 'block';
            document.getElementById('active-card-content').style.display = 'none';
        }
    </script>
</body>
</html>
