<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港鳥類圖鑑 Dex</title>
    <style>
        /* --- CSS 樣式設定 --- */
        :root {
            --primary-bg: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            --error-bg: #ff4757;
            --log-bg: #1e272e;
            --log-text: #0be881;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, 'Microsoft JhengHei', sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            background: var(--primary-bg);
            min-height: 100vh;
            color: #333;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .title-container {
            flex-grow: 1;
        }

        h1 {
            margin: 0 0 5px 0;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            font-size: 2rem;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            margin: 0;
            font-size: 1.1rem;
        }

        /* API 設定面板 */
        .api-config-panel {
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .api-config-panel label {
            font-weight: bold;
            font-size: 0.9rem;
            color: #2f3542;
        }

        .api-input {
            padding: 8px 12px;
            border: 2px solid #ced6e0;
            border-radius: 6px;
            width: 250px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .api-input:focus {
            border-color: #3742fa;
        }

        .save-btn {
            background-color: #2ed573;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .save-btn:hover {
            background-color: #26af5f;
        }

        /* 警告/錯誤 橫幅提示 */
        #error-message {
            display: none;
            background-color: #ffa502;
            color: #1e272e;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin: 0 auto 20px auto;
            max-width: 1200px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* 佈局容器 */
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .column {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 檔案上傳區域 */
        .upload-section {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .upload-btn {
            background-color: #3742fa;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .upload-btn:hover { background-color: #5352ed; }
        input[type="file"] { display: none; } /* 隱藏原生按鈕，由自訂按鈕觸發 */

        /* 磨砂玻璃質感寶可夢卡牌 */
        .pokemon-card-wrapper {
            position: relative;
            perspective: 1000px;
            min-height: 550px;
        }

        .pokemon-card {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            position: relative;
            overflow: hidden;
            min-height: 550px;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .pokemon-card:hover {
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.5);
        }

        /* 全息彩虹反光特效 */
        .pokemon-card::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; right: -50%; bottom: -50%;
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0) 30%, 
                rgba(255, 255, 255, 0.45) 45%, 
                rgba(255, 240, 150, 0.3) 50%, 
                rgba(150, 255, 255, 0.3) 55%, 
                rgba(255, 255, 255, 0) 70%
            );
            transform: rotate(25deg);
            pointer-events: none;
            animation: holoShine 7s infinite linear;
            z-index: 5;
        }

        @keyframes holoShine {
            0% { transform: translateX(-100%) rotate(25deg); }
            100% { transform: translateX(100%) rotate(25deg); }
        }

        /* 卡牌內部樣式 */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(0,0,0,0.1);
            padding-bottom: 8px;
            margin-bottom: 12px;
            z-index: 10;
        }

        .card-name-wrapper {
            display: flex;
            flex-direction: column;
        }

        .card-name { font-size: 1.6rem; font-weight: bold; color: #1e272e; }
        .card-subname { font-size: 0.9rem; color: #57606f; font-weight: 600; }
        .card-hp { font-size: 1.3rem; font-weight: bold; color: #c23616; }
        
        .card-image-container {
            background: rgba(0,0,0,0.08);
            height: 290px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            border: 3px solid rgba(255,255,255,0.6);
            overflow: hidden;
            position: relative;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* 官方預製插圖顯示 */
        .official-card-art {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        /* 照片/插圖 切換按鈕 */
        .view-toggle-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            z-index: 20;
            transition: background 0.2s;
            display: none;
        }
        .view-toggle-btn:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        .card-stats {
            background: rgba(255,255,255,0.65);
            padding: 12px;
            border-radius: 12px;
            flex-grow: 1;
            z-index: 10;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .card-intro {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #2f3640;
            text-align: justify;
            z-index: 10;
            line-height: 1.4;
        }

        /* 待掃描空白狀態預設圖 */
        .empty-placeholder {
            text-align: center;
            margin: auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 10;
        }

        .placeholder-card-back {
            max-width: 230px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.3s ease;
        }

        .pokemon-card:hover .placeholder-card-back {
            transform: scale(1.03) rotate(-1deg);
        }

        .placeholder-text {
            font-size: 1.1rem;
            font-weight: bold;
            color: #2f3542;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.6);
        }

        #active-card-content { display: none; height: 100%; flex-direction: column; }

        /* 讀取旋轉動畫 */
        .loader {
            display: none;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #3742fa;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
            position: absolute;
            z-index: 15;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 終端命令行日誌 (Dark Mode) */
        .scanning-log {
            background-color: var(--log-bg);
            color: var(--log-text);
            padding: 20px;
            border-radius: 12px;
            font-family: 'Courier New', Courier, monospace;
            height: 100%;
            min-height: 450px;
            overflow-y: auto;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            border: 2px solid #2f3640;
        }

        .log-entry { margin-bottom: 10px; line-height: 1.4; font-size: 0.95rem; }
        .log-entry.error { color: #ff4757; }
        .log-entry.success { color: #1e90ff; }
        .log-entry.warning { color: #ffa502; }
    </style>
</head>

                attack1: "Harbor Soar / 港灣盤旋 (50)",         
                attack2: "Fork-Tail Dive / 剪尾俯衝 (90)",         
                intro: "黑鳶俗稱「麻鷹」，是天天空之中最威風凜凜的頂級掠食者，也是著名的大型猛禽。牠們擁有寬大的深褐色翅膀，翱翔時尾羽會呈現出極具辨識度的「魚尾狀」開叉。黑鳶非常擅長利用熱氣流在維多利亞港上空、高樓大廈之間以及郊野山谷高空長時間盤旋。牠們憑藉敏銳的視力俯瞰大地，一旦發現獵物便會展現高超的俯衝技巧。",
                cardImage: "CardQu.png"            
            },     
            {         
                name: "Little Egret",         
                chineseName: "小白鷺",         
                hp: "80 HP",         
                type: "Water / Flying (水 / 飛行)",         
                attack1: "Yellow-Toe Wade / 黃趾涉水 (30)",         
                attack2: "Stream Strike / 明渠突襲 (60)",         
                intro: "小白鷺是水畔優雅的白色隱士。牠們全身覆蓋著無暇的純白色羽毛，體態修長而輕盈。其纖細的嘴喙呈現深黑色，而最有趣的特徵是那雙暗色的長腿下，長著一雙鮮黃色的腳趾，彷彿穿了一雙搶眼的芭蕾舞鞋。小白鷺常在沿海泥灘、內陸水塘或城市明渠中現身，牠們會用黃色腳趾攪動水底驚擾魚蝦，隨後以迅雷不及掩耳之勢精準捕食。",
                cardImage: "CardLittleWhite.png"            
            }
        ];

        // 自動生成引導 API 辨識的格式化字串
        const validBirdNames = birdDatabase.map(b => `${b.name} (${b.chineseName})`).join(", ");

        // --- 2. UI 元素與本地金鑰儲存 ---
        const logContainer = document.getElementById('log-container');
        const errorMessage = document.getElementById('error-message');
        const loader = document.getElementById('image-loader');
        const uiImage = document.getElementById('ui-image');
        const uiOfficialArt = document.getElementById('ui-official-art');
        const viewToggleBtn = document.getElementById('view-toggle');
        const apiKeyField = document.getElementById('apiKeyField');

        let currentActiveArtUrl = ""; 
        let showingOfficialArt = false; 

        // 啟動時載入瀏覽器已儲存的金鑰
        window.addEventListener('DOMContentLoaded', () => {
            const storedKey = localStorage.getItem('hk_bird_dex_key');
            if (storedKey) {
                apiKeyField.value = storedKey;
                document.getElementById('key-status').textContent = "> 系統設定: 已自動載入瀏覽器中的 Gemini API 金鑰。";
                document.getElementById('key-status').style.color = "#0be881";
            } else {
                document.getElementById('key-status').textContent = "> 系統提示: 尚未偵測到 API 金鑰。您可在上方輸入以啟用在線 AI 辨識。";
                document.getElementById('key-status').style.color = "#ffa502";
            }
        });

        function saveApiKey() {
            const enteredKey = apiKeyField.value.trim();
            if (enteredKey) {
                localStorage.setItem('hk_bird_dex_key', enteredKey);
                addLog("Gemini API 金鑰已成功儲存至此瀏覽器！", "success");
                document.getElementById('key-status').textContent = "> 系統設定: Gemini 在線 API 已啟用。";
                document.getElementById('key-status').style.color = "#0be881";
            } else {
                localStorage.removeItem('hk_bird_dex_key');
                addLog("API 金鑰已清除。", "warning");
                document.getElementById('key-status').textContent = "> 系統提示: 未配置 API 金鑰，將使用本地沙盒模擬運作。";
                document.getElementById('key-status').style.color = "#ffa502";
            }
        }

        function addLog(text, type = 'normal') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] > ${text}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function showCustomWarning(msg) {
            errorMessage.textContent = msg;
            errorMessage.style.display = 'block';
            setTimeout(() => { errorMessage.style.display = 'none'; }, 6000);
        }

        // 指數退避網路請求
        async function fetchWithBackoff(url, options, retries = 3) {
            const delays = [1000, 2000, 4000];
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        const errBody = await response.json().catch(() => ({}));
                        const errMsg = errBody.error?.message || `HTTP ${response.status}`;
                        throw new Error(errMsg);
                    }
                    return await response.json();
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        }

        // 切換顯示上傳的照片或精美預置卡牌插圖
        function toggleArtView() {
            if (!currentActiveArtUrl) return;
            
            showingOfficialArt = !showingOfficialArt;
            if (showingOfficialArt) {
                uiImage.style.display = 'none';
                uiOfficialArt.style.display = 'block';
                addLog("視覺顯示已切換至：官方預製全息卡牌插圖。");
            } else {
                uiImage.style.display = 'block';
                uiOfficialArt.style.display = 'none';
                addLog("視覺顯示已切換至：用戶上傳實拍照片。");
            }
        }

        // --- 3. 主要工作流程 (不需金鑰即可遊玩) ---
        document.getElementById('imageInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const storedKey = localStorage.getItem('hk_bird_dex_key') || apiKeyField.value.trim();

            addLog(`偵測到檔案: "${file.name}"。正在初始化生物識別系統...`, "normal");
            
            // 進入掃描特效畫面
            document.getElementById('card-placeholder').style.display = 'none';
            document.getElementById('active-card-content').style.display = 'flex';
            uiImage.style.display = 'none';
            uiOfficialArt.style.display = 'none';
            viewToggleBtn.style.display = 'none';
            loader.style.display = 'block';

            // 預載重設卡牌欄位
            document.getElementById('ui-name').textContent = "掃描分析中...";
            document.getElementById('ui-subname').textContent = "分析生物學分類法中...";
            document.getElementById('ui-hp').textContent = "---";
            document.getElementById('ui-type').textContent = "---";
            document.getElementById('ui-atk1').textContent = "---";
            document.getElementById('ui-atk2').textContent = "---";
            document.getElementById('ui-intro').textContent = "正在分析羽毛色澤、冠羽、嘴喙等重要特徵...";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const base64Image = e.target.result;
                
                // 保留用戶實拍照於背後
                uiImage.src = base64Image;
                uiImage.style.display = 'block';
                loader.style.display = 'none';

                if (!storedKey) {
                    addLog("未配置 API 金鑰。正在啟動本地圖鑑合成器...", "warning");
                    
                    // 模擬 1.5 秒的緊張掃描動畫，隨後隨機生成卡牌
                    setTimeout(() => {
                        forceRandomGeneration("離線沙盒模擬器");
                    }, 1500);
                } else {
                    addLog("已偵測到 API 金鑰。正在向 Google Gemini API 發送圖像特徵...", "normal");
                    callGeminiAPI(base64Image, storedKey);
                }
            };
            reader.onerror = function() {
                loader.style.display = 'none';
                showCustomWarning("無法處理該照片檔案。");
                addLog("錯誤: 檔案讀取失敗。", "error");
                resetCardUI();
            }
        });

        async function callGeminiAPI(base64FullString, storedKey) {
            const mimeType = base64FullString.match(/data:(.*?);/)[1];
            const base64Data = base64FullString.split(',')[1];

            const prompt = `Identify the bird in this image. It must be matched against this database list: [${validBirdNames}]. You must match the bird. Return ONLY the exact English name of the bird (e.g. "Spotted Dove") or the exact Chinese name (e.g. "紅耳鵯"). Do not output any other details, periods, prefix or explanation.`;

            const payload = {
                contents: [{
                    parts: [
                        { text: prompt },
                        { inlineData: { mimeType: mimeType, data: base64Data } }
                    ]
                }]
            };

            // 設定在線模型端點 (主模型: gemini-2.5-flash, 備用: gemini-1.5-flash)
            const primaryUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${storedKey}`;
            const secondaryUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${storedKey}`;

            try {
                addLog("正在與 Gemini 2.5 Flash 建立對接進行視覺分析...", "normal");
                const data = await fetchWithBackoff(primaryUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const aiResponseString = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
                addLog(`傳輸成功！AI 分析結果： "${aiResponseString}"`, "success");
                matchEngine(aiResponseString);

            } catch (error) {
                addLog(`Gemini 2.5 視覺分析遭遇障礙: ${error.message}`, "warning");
                addLog("正在自動切換至 Gemini 1.5 Flash 備用管道...", "normal");
                
                try {
                    const fallbackData = await fetchWithBackoff(secondaryUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const aiResponseString = fallbackData.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
                    addLog(`備用管道傳輸成功！AI 分析結果： "${aiResponseString}"`, "success");
                    matchEngine(aiResponseString);

                } catch (fallbackError) {
                    console.error("API 錯誤:", fallbackError);
                    addLog(`GOOGLE 伺服器回報錯誤: ${fallbackError.message}`, "error");
                    addLog("為確保遊玩流暢度，系統將自動啟動本地隨機合成器...", "warning");
                    forceRandomGeneration("自動容錯引擎");
                }
            }
        }

        // --- 4. 雙語比對引擎 ---
        function matchEngine(identifiedName) {
            addLog("正在將特徵與本地數據庫進行交叉比對...", "normal");

            // 去除空白、標點符號與特殊字元以達 100% 精準匹配
            const normalize = (str) => str.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]/g, "");
            const cleanResponse = normalize(identifiedName);

            // 同步支援英文學名與繁體中文比對
            const match = birdDatabase.find(bird => 
                normalize(bird.name) === cleanResponse || 
                normalize(bird.chineseName) === cleanResponse
            );

            if (match) {
                addLog(`比對成功！已配對數據庫項目：${match.chineseName} (${match.name})`, "success");
                updatePokemonCard(match);
            } else {
                addLog(`數據庫未查獲對應分類 "${identifiedName}"。`, "warning");
                forceRandomGeneration(identifiedName);
            }
        }

        function forceRandomGeneration(sourceLabel) {
            showCustomWarning("發現神秘未知鳥類！已為您隨機抽取合適的卡牌樣板。");
            
            // 從數據庫隨機選取
            const randomIndex = Math.floor(Math.random() * birdDatabase.length);
            const randomBird = birdDatabase[randomIndex];
            
            addLog(`本地隨機生成程序啟動 (觸發原因: "${sourceLabel}")`, "warning");
            addLog(`已成功解鎖全息卡牌範本：${randomBird.chineseName} / ${randomBird.name}!`, "success");
            
            updatePokemonCard(randomBird);
        }

        function updatePokemonCard(birdData) {
            // 更新文字與欄位內容
            document.getElementById('ui-name').textContent = birdData.chineseName || birdData.name;
            document.getElementById('ui-subname').textContent = birdData.chineseName ? birdData.name : "";
            document.getElementById('ui-hp').textContent = birdData.hp;
            document.getElementById('ui-type').textContent = birdData.type;
            document.getElementById('ui-atk1').textContent = birdData.attack1;
            document.getElementById('ui-atk2').textContent = birdData.attack2;
            document.getElementById('ui-intro').textContent = birdData.intro;

            // 處理卡牌圖片邏輯
            if (birdData.cardImage) {
                currentActiveArtUrl = birdData.cardImage;
                uiOfficialArt.src = birdData.cardImage;
                
                // 預設優先載入並顯示精美官方預製插圖
                uiImage.style.display = 'none';
                uiOfficialArt.style.display = 'block';
                showingOfficialArt = true;
                
                // 顯示切換按鈕，允許隨時在用戶實拍照與精美卡牌間切換
                viewToggleBtn.style.display = 'block';
                addLog(`全息投影卡牌就緒！可點擊圖片右下角的「切換顯示」按鈕來查看原圖。`);
            } else {
                currentActiveArtUrl = "";
                uiOfficialArt.src = "";
                uiImage.style.display = 'block';
                uiOfficialArt.style.display = 'none';
                showingOfficialArt = false;
                viewToggleBtn.style.display = 'none';
            }
            
            // 卡牌震落特效
            const card = document.querySelector('.pokemon-card');
            card.style.transform = 'scale(1.05)';
            setTimeout(() => { card.style.transform = 'scale(1)'; }, 300);
        }

        function resetCardUI() {
            document.getElementById('card-placeholder').style.display = 'block';
            document.getElementById('active-card-content').style.display = 'none';
        }
    </script>
</body>
</html>
