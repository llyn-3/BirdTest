        async function fetchWithBackoff(url, options, retries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
                    return await response.json();
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        }

                addLog("ERROR: Reading file failed.", "error");
                resetCardUI();
            }
        });

        async function callGeminiAPI(base64FullString) {
            const mimeType = base64FullString.match(/data:(.*?);/)[1];
            const base64Data = base64FullString.split(',')[1];
            const prompt = `Identify the bird in this image. It must be matched against this database list: [${validBirdNames}]. You must match the bird. Return ONLY the exact English name of the bird (e.g. "Spotted Dove") or the exact Chinese name (e.g. "紅耳鵯"). Do not output any other details, periods, prefix or explanation.`;
            const payload = { contents: [{ role: "user", parts: [{ text: prompt }, { inlineData: { mimeType: mimeType, data: base64Data } }] }] };

            try {
                const data = await fetchWithBackoff(GEMINI_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const aiResponseString = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
                addLog(`Vision data returned: "${aiResponseString}"`, "success");
                matchEngine(aiResponseString);
            } catch (error) {
                console.error("API Error:", error);
                addLog(`NETWORK DETECTED ISSUES: Initializing card synthesis sequence...`, "warning");
                forceRandomGeneration("Synthesizing deck");
            }
        }

        function matchEngine(identifiedName) {
            addLog("Cross-referencing database taxonomy...", "normal");
            const normalize = (str) => str.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]/g, "");
            const cleanResponse = normalize(identifiedName);
            const match = birdDatabase.find(bird => normalize(bird.name) === cleanResponse || normalize(bird.chineseName) === cleanResponse);

            if (match) {
                addLog(`Match Confirmed! Found Database Entry: ${match.chineseName} (${match.name})`, "success");
                updatePokemonCard(match);
            } else {
                addLog(`Could not find a direct database classification for "${identifiedName}".`, "warning");
                forceRandomGeneration(identifiedName);
            }
        }

        function forceRandomGeneration(sourceLabel) {
            showCustomWarning("我們將此識別為一個罕見的神秘變體！正在生成隨機的全息卡牌圖案。");
            const randomIndex = Math.floor(Math.random() * birdDatabase.length);
            const randomBird = birdDatabase[randomIndex];
            addLog(`RANDOM SCAN COMPLETED (Source identifier: "${sourceLabel}")`, "warning");
            addLog(`Holographic structural layout generated: ${randomBird.chineseName} / ${randomBird.name}!`, "success");
            updatePokemonCard(randomBird);
        }

        function updatePokemonCard(birdData) {
            document.getElementById('ui-name').textContent = birdData.chineseName || birdData.name;
            document.getElementById('ui-subname').textContent = birdData.chineseName ? birdData.name : "";
            document.getElementById('ui-hp').textContent = birdData.hp;
            document.getElementById('ui-type').textContent = birdData.type;
            document.getElementById('ui-atk1').textContent = birdData.attack1;
            document.getElementById('ui-atk2').textContent = birdData.attack2;
            document.getElementById('ui-intro').textContent = birdData.intro;

            if (birdData.cardImage) {
                currentActiveArtUrl = birdData.cardImage;
                uiOfficialArt.src = birdData.cardImage;
                uiImage.style.display = 'none';
                uiOfficialArt.style.display = 'block';
                showingOfficialArt = true;
                viewToggleBtn.style.display = 'block';
                addLog(`Hologram loaded! Use the "Switch View" button inside the card image to swap to your original upload.`);
            } else {
                currentActiveArtUrl = "";
                uiOfficialArt.src = "";
                uiImage.style.display = 'block';
                uiOfficialArt.style.display = 'none';
                showingOfficialArt = false;
                viewToggleBtn.style.display = 'none';
            }
            const card = document.querySelector('.pokemon-card');
            card.style.transform = 'scale(1.05)';
            setTimeout(() => { card.style.transform = 'scale(1)'; }, 300);
        }

        function resetCardUI() {
            document.getElementById('card-placeholder').style.display = 'block';
            document.getElementById('active-card-content').style.display = 'none';
        }
    </script>
</body>
</html>
